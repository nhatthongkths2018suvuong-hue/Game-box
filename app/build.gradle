plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minigame.fpt'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.minigame.fpt'
        minSdk 23
        targetSdk 23
        versionCode 1
        versionName '1.0'

        // armeabi-v7a chạy được trên cả box 32-bit lẫn 64-bit
        ndk { abiFilters 'armeabi-v7a' }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // Giải nén .so ra thư mục thư viện để dlopen() core bằng đường dẫn
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
